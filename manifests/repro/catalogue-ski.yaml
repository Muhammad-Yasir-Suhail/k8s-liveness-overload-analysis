# Arm SKI -- signal-based monitoring, emulated on stock Kubernetes.
#   * sidecar "ski" follows the catalogue logs through the API server
#   * failure signal -> SIGKILL main process (shared PID namespace) after 2 s
#   * ready signal   -> sets readinessGate condition g18.io/ski-ready=True
#   * DP liveness probe kept as a backstop, exactly as in the paper
apiVersion: v1
kind: Namespace
metadata: { name: ${NS} }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: g18-ski, namespace: ${NS} }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: g18-ski, namespace: ${NS} }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: g18-ski, namespace: ${NS} }
subjects: [ { kind: ServiceAccount, name: g18-ski, namespace: ${NS} } ]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: g18-ski }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalogue, namespace: ${NS}, labels: { name: catalogue } }
spec:
  replicas: 1
  selector: { matchLabels: { name: catalogue } }
  template:
    metadata: { labels: { name: catalogue } }
    spec:
      serviceAccountName: g18-ski
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 2
      readinessGates:
        - conditionType: g18.io/ski-ready
      containers:
        - name: catalogue
          image: weaveworksdemos/catalogue:0.3.5
          imagePullPolicy: IfNotPresent
          # Roberts et al.: "the catalogue program runs under a shell which
          # writes a log and hangs after the catalogue terminates".
          command: ["/bin/sh", "-c"]
          args:
            - >-
              echo "G18WRAP wrapper started";
              /app -port=8080 -DSN='catalogue_user:default_password@tcp(catalogue-db.g18-db:3306)/socksdb';
              echo "G18-FAILURE catalogue process exited";
              while true; do sleep 3600; done
          ports: [ { containerPort: 8080 } ]
          resources:
            limits:   { cpu: 200m, memory: 200Mi }
            requests: { cpu: 100m, memory: 100Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            capabilities: { drop: [ "ALL" ], add: [ "NET_BIND_SERVICE" ] }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 300
            periodSeconds: 3
            failureThreshold: 3
            timeoutSeconds: 1
        - name: ski
          image: g18/tools:latest
          imagePullPolicy: IfNotPresent
          command: ["/ski"]
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: TARGET_CONTAINER, value: catalogue }
            - { name: FAIL_PATTERN, value: "G18-FAILURE" }
            - { name: READY_PATTERN, value: "transport=HTTP" }
            - { name: READY_FALLBACK_ADDR, value: "127.0.0.1:8080" }
            - { name: READY_FALLBACK_AFTER_MS, value: "3000" }
            - { name: KILL_MATCH, value: "G18WRAP" }
            - { name: KILL_DELAY_MS, value: "2000" }
          resources:
            limits:   { cpu: 100m, memory: 64Mi }
            requests: { cpu: 20m,  memory: 16Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata: { name: catalogue, namespace: ${NS} }
spec:
  selector: { name: catalogue }
  ports: [ { port: 80, targetPort: 8080 } ]
