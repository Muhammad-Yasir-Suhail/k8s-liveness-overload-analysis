# SockShop catalogue database (unchanged from the official SockShop manifest).
# Deployed ONCE in namespace g18-db and shared by all reproduction runs.
apiVersion: v1
kind: Namespace
metadata: { name: g18-db }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalogue-db, namespace: g18-db, labels: { name: catalogue-db } }
spec:
  replicas: 1
  selector: { matchLabels: { name: catalogue-db } }
  template:
    metadata: { labels: { name: catalogue-db } }
    spec:
      containers:
        - name: catalogue-db
          image: weaveworksdemos/catalogue-db:0.3.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: MYSQL_ROOT_PASSWORD, value: fake_password }
            - { name: MYSQL_DATABASE, value: socksdb }
          ports: [ { name: mysql, containerPort: 3306 } ]
          readinessProbe:
            tcpSocket: { port: 3306 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: catalogue-db, namespace: g18-db }
spec:
  selector: { name: catalogue-db }
  ports: [ { port: 3306, targetPort: 3306 } ]
